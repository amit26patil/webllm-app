<div class="day-view">
  <div class="day-header">
    <button class="back-btn" (click)="goBack()">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M15 10H5M5 10L10 5M5 10L10 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Calendar
    </button>
    <div class="day-nav">
      <button class="nav-btn" (click)="prevDay()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M11 14L6 9L11 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="day-title-section">
        <h2 class="day-title">{{ formattedDate() }}</h2>
        @if (isToday()) {
          <span class="today-badge">Today</span>
        }
      </div>
      <button class="nav-btn" (click)="nextDay()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M7 4L12 9L7 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <button class="add-btn" (click)="openNewEntry()">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      New Entry
    </button>
  </div>

  <div class="day-content">
    <app-entry-list
      [entries]="entries()"
      [showDate]="false"
      (edit)="openEditEntry($event)"
      (delete)="confirmDelete($event)"
    />
  </div>

  @if (showForm()) {
    <app-entry-form
      [entry]="editingEntry()"
      [defaultDate]="date()"
      (save)="saveEntry($event)"
      (cancel)="closeForm()"
    />
  }

  @if (showDeleteConfirm()) {
    <div class="confirm-overlay" (click)="cancelDelete()">
      <div class="confirm-card" (click)="$event.stopPropagation()">
        <div class="confirm-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2"/>
            <path d="M24 14V28M24 32V34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h3>Delete Entry?</h3>
        <p>This action cannot be undone.</p>
        <div class="confirm-actions">
          <button class="btn btn-secondary" (click)="cancelDelete()">Cancel</button>
          <button class="btn btn-danger" (click)="doDelete()">Delete</button>
        </div>
      </div>
    </div>
  }
</div>
