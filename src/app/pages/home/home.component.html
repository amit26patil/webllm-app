<div class="home">
  <div class="home-header">
    <div class="header-content">
      <div class="greeting">
        <h1>My Journal</h1>
        <p>Capture your thoughts, track your growth</p>
      </div>
      <button class="new-entry-btn" (click)="openNewEntry()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        New Entry
      </button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon entries-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 2V8H20M16 13H8M16 17H8M10 9H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="stat-info">
        <span class="stat-value">{{ totalEntries() }}</span>
        <span class="stat-label">Total Entries</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon days-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M16 2V6M8 2V6M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="stat-info">
        <span class="stat-value">{{ totalDays() }}</span>
        <span class="stat-label">Days Logged</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon streak-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="stat-info">
        <span class="stat-value">{{ currentStreak() }}</span>
        <span class="stat-label">Day Streak</span>
      </div>
    </div>
  </div>

  <div class="main-layout">
    <div class="sidebar">
      <app-calendar />
    </div>

    <div class="content">
      <div class="content-header">
        <h2>Recent Entries</h2>
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 12L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input
            type="text"
            placeholder="Search entries..."
            [value]="searchQuery()"
            (input)="updateSearch($any($event.target).value)"
          />
        </div>
      </div>
      <app-entry-list
        [entries]="recentEntries()"
        [showDate]="true"
        (edit)="openEditEntry($event)"
        (delete)="confirmDelete($event)"
        (view)="viewEntry($event)"
      />
    </div>
  </div>

  @if (showForm()) {
    <app-entry-form
      [entry]="editingEntry()"
      (save)="saveEntry($event)"
      (cancel)="closeForm()"
    />
  }

  @if (showDeleteConfirm()) {
    <div class="confirm-overlay" (click)="cancelDelete()">
      <div class="confirm-card" (click)="$event.stopPropagation()">
        <div class="confirm-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2"/>
            <path d="M24 14V28M24 32V34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h3>Delete Entry?</h3>
        <p>This action cannot be undone.</p>
        <div class="confirm-actions">
          <button class="btn btn-secondary" (click)="cancelDelete()">Cancel</button>
          <button class="btn btn-danger" (click)="doDelete()">Delete</button>
        </div>
      </div>
    </div>
  }
</div>
