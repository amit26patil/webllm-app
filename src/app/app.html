<div class="app-shell">
  <aside class="app-sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="4" y="2" width="20" height="24" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M9 8H19M9 13H19M9 18H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-name">Journal</span>
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/" class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/summary" class="nav-item" routerLinkActive="active">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 10C3 10 6 4 10 4C14 4 17 10 17 10C17 10 14 16 10 16C6 16 3 10 3 10Z" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Summaries</span>
        <span class="nav-badge ai">AI</span>
      </a>
      <a routerLink="/chat" class="nav-item" routerLinkActive="active">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 15L2 18V4C2 3.46957 2.21071 2.96086 2.58579 2.58579C2.96086 2.21071 3.46957 2 4 2H16C16.5304 2 17.0391 2.21071 17.4142 2.58579C17.7893 2.96086 18 3.46957 18 4V12C18 12.5304 17.7893 13.0391 17.4142 13.4142C17.0391 13.7893 16.5304 14 16 14H6L4 15Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Chat</span>
        <span class="nav-badge ai">AI</span>
      </a>
      <a routerLink="/search" class="nav-item" routerLinkActive="active">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
          <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M7 9H11M9 7V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
        </svg>
        <span>Smart Search</span>
        <span class="nav-badge ai">AI</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="powered-by">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1L8.5 5L13 6.5L8.5 8L7 13L5.5 8L1 6.5L5.5 5L7 1Z" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Powered by WebLLM</span>
      </div>
    </div>
  </aside>
  <main class="app-main">
    <router-outlet />
  </main>
</div>
